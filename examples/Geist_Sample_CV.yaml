# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
#
# Sample one-page resume with the Geist design. All names, contacts and employers are made up.
# Needs the Geist, Geist Mono and Geist Pixel fonts installed. Render with:
#   rendercv render examples/Geist_Sample_CV.yaml
#
# Things this sample shows:
#   design.sections.hide_titles_for  hides the SUMMARY heading
#   design.colors / typography .entry_titles and .dates  style entry titles and dates separately
#   design.entries.short_second_row: false  lets bullets use the full page width
#   EDUCATION / SKILLS / REFEREES rows built from Typst helpers (#entry-title, #date-cell, #cell,
#   #title-cell, #meta-cell). RenderCV only passes flat commands through: #name(args)[content] with
#   no ")" in args and no "]" in content, and two identical commands in one line must not be nested.
cv:
  name: Alex Morgan
  email: alex.morgan@example.com
  phone: "+61 491 570 006"
  social_networks:
    - network: LinkedIn
      username: alex-morgan-example
  sections:
    SUMMARY:
      - bullet: Computer engineering graduate with a keen interest in embedded software and robotics.
      - bullet: Experience building sensor-driven prototypes, from firmware to the dashboards that read them.
      - bullet: Teamwork and communication shown through tutoring and volunteer coaching.
      - bullet: Seeking software or robotics roles that put hardware and software together.
    EDUCATION:
      - '#entry-title[EXAMPLE UNIVERSITY]#h(1fr)#box(width: 2.6cm)[]#date-cell[2018 — PRESENT]'
      - 'Bachelor of Engineering (Honours) & Science (Computer Science)#h(1fr)#box(width: 2.6cm)[WAM: 80.000]#date-cell[2020 — PRESENT]'
      - 'Bachelor of Engineering (Honours) & Bachelor of Commerce#h(1fr)#box(width: 2.6cm)[WAM: 78.500]#date-cell[2018 — 2020]'
      - '#emph[Dean’s Honour List (Highly Commended 2020 — 2022)]#h(1fr)#box(width: 2.6cm)[]#date-cell[2018 — 2022]'
      - '#v(0.35em)#entry-title[SAMPLE INSTITUTE OF TECHNOLOGY]#h(1fr)#box(width: 2.6cm)[]#date-cell[2019]'
      - Foreign University Exchange Program
      - '#v(0.35em)#entry-title[EXAMPLE HIGH SCHOOL]#h(1fr)#box(width: 2.6cm)[]#date-cell[2012 — 2017]'
      - 'Higher School Certificate#h(1fr)#box(width: 2.6cm)[ATAR: 90.00]#date-cell[2017]'
    EMPLOYMENT:
      - company: ACME ROBOTICS
        position: SOFTWARE ENGINEERING INTERN
        date: "2024 JUN — PRESENT"
        highlights:
          - Containerised the simulation environment so every team member could reproduce a robot run with one command, cutting setup from a day to ten minutes.
          - Wrote the documentation and CI checks that kept the team's build and deployment steps repeatable.
          - Integrated a flight controller with the robot's navigation stack to test control ideas in simulation.
      - company: EXAMPLE UNIVERSITY
        position: ACADEMIC TUTOR
        date: "2022 FEB — PRESENT"
        highlights:
          - Tutored first and second year programming and systems courses for small groups each week.
          - Wrote worked examples and practice questions that students used to prepare for assessments.
          - Gave clear, constructive feedback on assignments and ran group discussions.
    RELEVANT EXPERIENCES & PROJECTS:
      - name: UNDERGRADUATE RESEARCH THESIS, DR. SAMPLE SUPERVISOR
        date: "2023 "  # trailing space keeps a bare year from being parsed as "Jan 2023"
        summary: Built and tested a low-cost printed strain sensor for a prosthetic hand, with real-time wireless readout and sensor layouts that can be changed per user.
      - name: ROBOT COMPETITION, EXAMPLE ENGINEERING SOCIETY
        date: "2022 "
        summary: Designed a sumo robot with line sensors and autonomous navigation that won the advanced stream against eleven other teams.
    SKILLS:
      - label: PROGRAMMING
        details: C++, C, Rust, Python, Shell, Java
      - label: LANGUAGES
        details: English, Spanish (conversational)
      - label: PROFESSIONAL SOFTWARE
        details: CAD/CAM, MATLAB, Slicer
      - label: INTERESTS
        details: Photography, Additive Manufacturing, Robotics
    REFEREES:
      - '#cell(6cm)[DR. FIRST REFEREE]#h(1fr)#meta-cell(3.4cm)[SENIOR LECTURER]#meta-cell(6.4cm)[EXAMPLE UNIVERSITY]'
      - '#cell(6cm)[DR. SECOND REFEREE]#h(1fr)#meta-cell(3.4cm)[SENIOR LECTURER]#meta-cell(6.4cm)[EXAMPLE UNIVERSITY]'
design:
  theme: classic
  page:
    size: a4
    top_margin: 1.4cm
    bottom_margin: 1.4cm
    left_margin: 1.6cm
    right_margin: 1.6cm
    show_footer: false
    show_top_note: false
  entries:
    degree_width: 0cm
    short_second_row: false
    date_and_location_width: 3.8cm
    side_space: 0cm
    highlights:
      space_left: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  sections:
    hide_titles_for: [summary]
    space_between_regular_entries: 0.9em
    space_between_text_based_entries: 0.15em
  header:
    space_below_name: 0.7cm
    space_below_connections: 0.3cm
    connections:
      phone_number_format: international
      show_icons: false
      display_urls_instead_of_usernames: true
      space_between_connections: 1.8cm
  colors:
    body: rgb(40, 40, 40)
    entry_titles: rgb(85, 85, 85)
    dates: rgb(130, 130, 130)
    name: rgb(222, 99, 77)
    section_titles: rgb(222, 99, 77)
    links: rgb(222, 99, 77)
    connections: rgb(222, 99, 77)
  links:
    underline: false
  typography:
    alignment: left
    line_spacing: 0.5em
    font_size:
      body: 9pt
      name: 28pt
      connections: 7.5pt
      section_titles: 1.2em
    small_caps:
      connections: false
    bold:
      name: true
      entry_titles: false
      section_titles: true
    font_family:
      body: Geist
      name: Geist Pixel Square
      headline: Geist
      connections: Geist Mono
      section_titles: Geist Mono
      entry_titles: Geist Mono
      dates: Geist Mono
  section_titles:
    type: with_full_line
    space_above: 0.55cm
    space_below: 0.2cm
  templates:
    one_line_entry:
      main_column: '#title-cell(4.4cm)[LABEL]DETAILS'
    education_entry:
      main_column: |-
        INSTITUTION
        AREA
        SUMMARY
        HIGHLIGHTS
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
    experience_entry:
      main_column: |-
        **POSITION, COMPANY**
        SUMMARY
        HIGHLIGHTS
settings:
  render_command:
    output_folder: build
    dont_generate_html: true
    dont_generate_markdown: true
